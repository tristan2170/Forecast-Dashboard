<!DOCTYPE html>
<html lang="en">
<head>
    <title>Weather Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Fraunces">
    <link rel="stylesheet"  type="text/css" href="./style.css">
    <script src="https://kit.fontawesome.com/c7eb3c9bd5.js" crossorigin="anonymous"></script>
    <script type="module"   src="../js/config.js"></script>
    <script type="module"   src="../js/carousel.js"></script>
    <script type="module"   src="../js/forecast_caller.js"></script>
    <script type="module"   src="../js/headline_caller.js"></script>
    <script type="module"   src="../js/gainers_losers.js"></script>
    <script type="module"   src="../js/forex.js"></script>
    <script type="module"   src="../js/commodities.js"></script>
</head>

<body>

    <div class="flex-container">
        <div class="left-sidebar">
            <div class="sidebar-icons">
                <a href="#"><i class="fa-solid fa-user"></i></a>
                <a href="#"><i class="fa-solid fa-house"></i></a>
                <a href="#"><i class="fa-solid fa-message"></i></a>
                <a href="#"><i class="fa-solid fa-envelope"></i></a>
                <a href="#"><i class="fa-solid fa-address-book"></i></a>
            </div>
            <div class="gear icon">
                <a href="#"><i class="fa-solid fa-gear"></i></a>
            </div>
            
        </div><!--End of left sidebar-->
        
        
        <div class="main-mid">
            <div class="flex-container">
                <div class="date-time">
                    <p class="date"></p>
                    <p class="time"></p> 
                </div>
                <div class="weather-slideshow">
                    <div class="wthr-slide fade">
                        <p class= "slide-text" id="location1"></p>
                        <p class= "slide-text" id="headline1"></p>
                        <p class= "slide-text" id="max1"></p>
                        <p class= "slide-text" id="min1"></p>     
                    </div>
                    <div class="wthr-slide fade">     
                        <p class= "slide-text" id="location2"></p>
                        <p class= "slide-text" id="headline2"></p>
                        <p class= "slide-text" id="max2"></p>
                        <p class= "slide-text" id="min2"></p>   
                    </div>
                    <div class="wthr-slide fade">
                        <p class= "slide-text" id="location3"></p>
                        <p class= "slide-text" id="headline3"></p>
                        <p class= "slide-text" id="max3"></p>
                        <p class= "slide-text" id="min3"></p>       
                    </div>
                </div>
    
                <div class="headline-slideshow">
                    <div class="headline-slide fade">
                        <p class= "slide-text" id="source1"></p>
                        <p class= "slide-text" id="title1"></p>  
                        <a href="#" class="slide-text"  id="url1"></a>
                    </div>
                    <div class="headline-slide fade">  
                        <p class= "slide-text" id="source2"></p>   
                        <p class= "slide-text" id="title2"></p>
                        <a href="#" class="slide-text"  id="url2"></a>    
                    </div> 
                    <div class="headline-slide fade">    
                        <p class= "slide-text" id="source3"></p>
                        <p class= "slide-text" id="title3"></p>
                        <a href="#" class="slide-text"  id="url3"></a>     
                    </div>                                
                </div>   
                
                <div class="searchbar">
                    <form action="" class="searchbar-form">
                        <input type="text" placeholder="Search" name="search">
                        <button href="" class="search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </form>  
                </div>
            </div> 
            
            <div class="flex-container">
                <div class="gain-lose-slideshow">
                    <div class="gainlose-flex">
                        <div class="green-triangle"></div>
                        <div class="gainers-slideshow"> 
                            <div class="gain-slide fade">
                                <p class="slide-text" id="gain-tick1"></p>
                                <p class="slide-text" id="gain-percen1"></p>
                            </div> 
                            <div class="gain-slide fade">
                                <p class="slide-text" id="gain-tick2"></p>
                                <p class="slide-text" id="gain-percen2"></p>
                            </div>
                            <div class="gain-slide fade">
                                <p class="slide-text" id="gain-tick3"></p>
                                <p class="slide-text" id="gain-percen3"></p>
                            </div>
                            
                        </div>
                        <div class="red-triangle"></div>
                        <div class="losers-slideshow">
                            <div class="lose-slide fade">
                                <p class="slide-text" id="lose-tick1"></p>
                                <p class="slide-text" id="lose-percen1"></p>
                            </div>
                            <div class="lose-slide fade">
                                <p class="slide-text" id="lose-tick2"></p>
                                <p class="slide-text" id="lose-percen2"></p>
                            </div>
                            <div class="lose-slide fade">
                                <p class="slide-text" id="lose-tick3"></p>
                                <p class="slide-text" id="lose-percen3"></p>
                            </div> 
                        </div>       
                    </div>
                </div>
                <div class="forex-slideshow">
                    <div class="forex-slide fade">
                        <p class="slide-text" id="curr-pair1"></p>
                        <p class="slide text" id="exch-rate1"></p>
                    </div>
                    <div class="forex-slide fade">
                        <p class="slide-text" id="curr-pair2"></p>
                        <p class="slide text" id="exch-rate2"></p>
                    </div>
                    <div class="forex-slide fade">
                        <p class="slide-text" id="curr-pair3"></p>
                        <p class="slide text" id="exch-rate3"></p>
                    </div>
                </div> 

                <div class="commodities-container">
                    <div class="oil">
                        <p class="slide-text">Crude Oil</p>
                        <p class="slide-text" id="date1"></p>
                        <p class="slide text" id="value1"></p>
                        <p class="slide-text" id="unit1"></p>
                    </div>
                    <br>
                    <div class="gas">
                        <p class="slide-text">Natural Gas</p>
                        <p class="slide-text" id="date2"></p>
                        <p class="slide text" id="value2"></p>
                        <p class="slide-text" id="unit2"></p>
                    </div>
                    <br>
                    <div class="copper">
                        <p class="slide-text">Copper</p>
                        <p class="slide-text" id="date3"></p>
                        <p class="slide text" id="value3"></p>
                        <p class="slide-text" id="unit3"></p>
                    </div>
                </div>    
            </div> <!--End of second row flex container-->
        </div> <!--End of midbar content -->  
    </div>

</body>
</html>
